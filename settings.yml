transformer:
  class: org.example.Mutator
  retry: 1
  max_workers: 8

agent:
  ######### settings for remote API #########
  timeout: 120
  sleep: 5
  retry: 3
  retry_interval: 30
  max_workers: 2

  ######## settings for local models ########
  max_new_tokens: 2048

logger:
  max_bytes: 5242880 # 5MB
  backup_count: 5

metrics:
  timeout: 60 # unit: seconds
  max_workers: 8
