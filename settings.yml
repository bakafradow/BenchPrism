transformer:
  class: org.example.Mutator
  retry: 1
  max_workers: 8

agent:
  ######### settings for remote API #########
  timeout: 120
  retry: 3
  retry_interval: 10
  max_workers: 4

  ######## settings for local models ########
  max_new_tokens: 2048

logger:
  max_bytes: 5242880 # 5MB
  backup_count: 5

metrics:
  target_dir: targets/ # the path where compiled files are stored
  result_dir: results/ # the path where evaluation results are stored
  timeout: 60 # unit: seconds
  max_workers: 8
